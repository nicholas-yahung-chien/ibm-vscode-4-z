# IBM VSCode for Z Development Environment Configuration
# 開發單位: IBM Taiwan Technology Expert Labs
# 版本: 1.0.0
# 日期: 2025/01/13

# 基本連線參數（必填）
#host: "your-zos-server.example.com"
#user: "your-username"
#password: "your-password"

# zOSMF 連線設定
#zosmf:
  #port: 443
  #encoding: "IBM-937"

# TSO 連線設定
#tso:
  #codepage: 1047

# SSH 連線設定
#ssh:
  #port: 22

# FTP 連線設定
#ftp:
  #port: 21

# RSE 連線設定
#rse:
  #port: 6800
  #encoding: "IBM-937"

# zOpenDebug 連線設定
#debug:
  #port: 8143
